name: Redraw Live Panel

on:
  schedule:
    - cron: "7 * * * *"
  push:
    branches: [main]
    paths: [scripts/live-card.mjs, .github/workflows/live.yml]
  workflow_dispatch:

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Draw panel
        run: node scripts/live-card.mjs dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
      - name: Publish to live branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: live
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
